<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>申込フォーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: "メイリオ", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 480px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    h2 {
      color: #003366;
      margin-top: 0;
      border-left: 6px solid #003366;
      padding-left: 10px;
      font-size: 20px;
    }
    p {
      font-size: 14px;
      color: #003366;
      line-height: 1.6;
    }
    .required {
      color: #cc0000;
      font-size: 12px;
      margin-left: 6px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      color: #003366;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      background-color: #0066cc;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>申込フォーム</h2>

    <form id="entryForm"
          action="https://script.google.com/macros/s/AKfycbz1y4lCqQuPYoBdlU4WRNNfB3cA355gB4MgluTw3p3TxcVnTHcqdQIWHZKxpWCqIKja/exec"
          method="POST">

      <label>カテゴリ <span class="required">※必須</span></label>
      <select name="category" required>
        <option value="">選択してください</option>
        <option value="official">オフィシャル</option>
        <option value="junior">ジュニア</option>
      </select>

      <label>チーム名 <span class="required">※必須</span></label>
      <input type="text" name="team" required>

      <label>代表者名 <span class="required">※必須</span></label>
      <input type="text" name="leader" required>

      <label>メールアドレス1 <span class="required">※必須</span></label>
      <input type="email" name="email" required autocomplete="email">

      <label>メールアドレス2</label>
      <input type="email" name="email2" autocomplete="email">

      <label>電話番号 <span class="required">※必須</span></label>
      <input type="tel" name="phone" required placeholder="例: 09012345678">

      <button type="submit">登録する</button>
    </form>

  </div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const form = document.getElementById("entryForm");

  form.addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = new FormData(form);

    fetch(form.action, {
      method: "POST",
      body: formData
    })
    .then(res => res.json())
    .then(res => {
      switch(res.status) {
        case "ok":
          alert("登録が完了しました。メール認証を行ってください。");
          form.reset();
          break;

        case "invalid_category":
          alert("カテゴリが不正です。");
          break;

        case "invalid_email":
          alert("メールアドレスの形式が正しくありません。");
          break;

        case "duplicate":
          alert("このメールアドレスはすでに登録されています。");
          break;

        case "limit":
          alert("受付が上限に達しました。");
          break;

        default:
          alert("サーバーエラーが発生しました。");
      }
    })
    .catch(() => {
      alert("通信エラーが発生しました。");
    });
  });

});
</script>


</body>
</html>
