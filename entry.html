<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>チーム登録フォーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: "メイリオ", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 480px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    h2 {
      color: #003366;
      margin-top: 0;
      border-left: 6px solid #003366;
      padding-left: 10px;
      font-size: 20px;
    }
    p {
      font-size: 14px;
      color: #003366;
      line-height: 1.6;
    }
    .required {
      color: #cc0000;
      font-size: 12px;
      margin-left: 6px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      color: #003366;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      background-color: #0066cc;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #999;
    }
    #result {
      margin-top: 15px;
      font-size: 14px;
      color: #333;
      background: #eef5ff;
      padding: 10px;
      border-left: 4px solid #0066cc;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>チーム登録フォーム</h2>

    <p>以下の情報を入力してください。</p>

    <label>チーム名 <span class="required">※必須</span></label>
    <input type="text" id="team" required>

    <label>代表者名 <span class="required">※必須</span></label>
    <input type="text" id="leader" required>

    <label>メールアドレス1 <span class="required">※必須</span></label>
    <input type="email" id="email1" required autocomplete="email">

    <label>メールアドレス2</label>
    <input type="email" id="email2" autocomplete="email">

    <label>電話番号 <span class="required">※必須</span></label>
    <input id="phone" type="tel" required
          inputmode="numeric"
          placeholder="例: 09012345678">

    <button onclick="submitEntry()">登録する</button>

    <div id="result"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxTk4qzLGEFTwZ4EhBouo0rHkE2EaDHZz0TuI46F9oYgTqaoN7MV397Whzn1TW1RB85/exec";

    function submitEntry() {
      const team = document.getElementById("team").value.trim();
      const leader = document.getElementById("leader").value.trim();
      const mail1 = document.getElementById("email1").value.trim();
      const mail2 = document.getElementById("email2").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (!team || !leader || !mail1 || !phone) {
        showMessage("必須項目を入力してください。");
        return;
      }

      const phoneDigits = phone.replace(/-/g, "");
      if (!/^[0-9]+$/.test(phoneDigits) || phoneDigits.length < 10 || phoneDigits.length > 11) {
        showMessage("電話番号は数字のみで10〜11桁で入力してください。");
        return;
      }

      document.querySelector("button").disabled = true;
      showMessage("送信中…");

      const data = {
        teamName: team,
        repName: leader,
        mail1: mail1,
        mail2: mail2,
        tel: phone
      };

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "ok") {
          showMessage("チーム登録を受け付けました。");
        } else {
          showMessage("エラーが発生しました。");
        }
        document.querySelector("button").disabled = false;
      })
      .catch(() => {
        showMessage("通信エラーが発生しました。");
        document.querySelector("button").disabled = false;
      });
    }

    function showMessage(msg) {
      const result = document.getElementById("result");
      result.style.display = "block";
      result.innerHTML = msg;
    }
  </script>

</body>
</html>
