<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>大会申込フォーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: "メイリオ", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 480px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    h2 {
      color: #003366;
      margin-top: 0;
      border-left: 6px solid #003366;
      padding-left: 10px;
      font-size: 20px;
    }

    p {
      font-size: 14px;
      color: #003366;
      line-height: 1.6;
    }

    .required {
      color: #cc0000;
      font-size: 12px;
      margin-left: 6px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      color: #003366;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      background-color: #0066cc;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:disabled {
      background-color: #999;
    }

    #result {
      margin-top: 15px;
      font-size: 14px;
      color: #333;
      background: #eef5ff;
      padding: 10px;
      border-left: 4px solid #0066cc;
      display: none;
    }

    @media (max-width: 480px) {
      h2 { font-size: 18px; }
      label { font-size: 13px; }
      input, select { font-size: 14px; padding: 9px; }
      button { font-size: 15px; padding: 12px 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>大会申込フォーム</h2>

    <p>
      以下の情報を入力して整理券を取得してください。<br>
      整理券取得後、メールに記載されたリンクから認証を行うと本登録が完了します。
    </p>

    <label>メールアドレス <span class="required">※必須</span></label>
    <input type="email" id="email" required autocomplete="email">

    <label>チーム名 <span class="required">※必須</span></label>
    <input type="text" id="team" required>

    <label>代表者名 <span class="required">※必須</span></label>
    <input type="text" id="leader" required>

    <label>電話番号 <span class="required">※必須</span></label>
    <input id="phone" type="tel" required
          inputmode="numeric"
          placeholder="例: 09012345678"
          title="電話番号は数字のみ（ハイフンなし）で10〜11桁で入力してください">

    <label>カテゴリ <span class="required">※必須</span></label>
    <select id="category">
      <option value="official">オフィシャル</option>
      <option value="junior">ジュニア</option>
    </select>

    <button onclick="submitEntry()">整理券を取得する</button>

    <div id="result"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz1y4lCqQuPYoBdlU4WRNNfB3cA355gB4MgluTw3p3TxcVnTHcqdQIWHZKxpWCqIKja/exec";

    function submitEntry() {
      const email = document.getElementById("email").value.trim();
      const team = document.getElementById("team").value.trim();
      const leader = document.getElementById("leader").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const category = document.getElementById("category").value;

      if (!email || !team || !leader || !phone) {
        showMessage("すべての項目を入力してください。");
        return;
      }

      const phoneDigits = phone.replace(/-/g, "");
      if (!/^[0-9]+$/.test(phoneDigits) || phoneDigits.length < 10 || phoneDigits.length > 11) {
        showMessage("電話番号は数字のみで10〜11桁で入力してください。");
        return;
      }

      document.querySelector("button").disabled = true;
      showMessage("送信中…");

      const data = {
        email: email,
        team: team,
        leader: leader,
        phone: phone,
        category: category
      };

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          showMessage("整理券を発行しました。メールをご確認ください。");
        } else if (res.status === "duplicate_email") {
          showMessage("このメールアドレスはすでに登録されています。");
        } else if (res.status === "invalid_email") {
          showMessage("メールアドレスの形式が正しくありません。");
        } else {
          showMessage("エラーが発生しました。時間をおいて再度お試しください。");
        }
        document.querySelector("button").disabled = false;
      })
      .catch(() => {
        showMessage("通信エラーが発生しました。");
        document.querySelector("button").disabled = false;
      });
    }

    function showMessage(msg) {
      const result = document.getElementById("result");
      result.style.display = "block";
      result.innerHTML = msg;
    }
  </script>

</body>
</html>
