<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>チーム登録フォーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: "メイリオ", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 480px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    h2 {
      color: #003366;
      margin-top: 0;
      border-left: 6px solid #003366;
      padding-left: 10px;
      font-size: 20px;
    }
    p {
      font-size: 14px;
      color: #003366;
      line-height: 1.6;
    }
    .required {
      color: #cc0000;
      font-size: 12px;
      margin-left: 6px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      color: #003366;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      background-color: #0066cc;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>チーム登録フォーム</h2>

    <p>以下の情報を入力してください。</p>

    <form action="https://script.google.com/macros/s/AKfycbws0_ijCHJUd31B9nABcyzZVuwON9-fWKXsZaYRcf3g8_WCIPqgfedAD9j4Ev4NwrRG/exec"
          method="POST">

      <input type="hidden" name="mode" value="entry">

      <label>チーム名 <span class="required">※必須</span></label>
      <input type="text" name="teamName" required>

      <label>代表者名 <span class="required">※必須</span></label>
      <input type="text" name="repName" required>

      <label>メールアドレス1 <span class="required">※必須</span></label>
      <input type="email" name="mail1" required autocomplete="email">

      <label>メールアドレス2</label>
      <input type="email" name="mail2" autocomplete="email">

      <label>電話番号 <span class="required">※必須</span></label>
      <input type="tel" name="tel" required placeholder="例: 09012345678">

      <button type="submit">登録する</button>
    </form>

  </div>

</body>
</html>
