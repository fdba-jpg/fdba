<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>申込フォーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: "メイリオ", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 480px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    h2 {
      color: #003366;
      margin-top: 0;
      border-left: 6px solid #003366;
      padding-left: 10px;
      font-size: 20px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      color: #003366;
      font-size: 14px;
    }
    .required {
      color: #cc0000;
      font-size: 12px;
      margin-left: 6px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      box-sizing: border-box;
    }

    /* ▼ ドロップエリア */
    .drop-area {
      border: 2px dashed #999;
      border-radius: 6px;
      padding: 30px 10px;
      text-align: center;
      color: #666;
      cursor: pointer;
      margin-top: 10px;
      background: #fafafa;
      transition: 0.2s;
      font-size: 14px;
      line-height: 1.6;
    }
    .drop-area.dragover {
      border-color: #0066cc;
      background: #e8f2ff;
      color: #0066cc;
    }
    input[type="file"] {
      display: none;
    }

    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      background-color: #0066cc;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }

    #msg {
      margin-top: 15px;
      color: #003366;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>申込フォーム</h2>

    <form id="entryForm">
      <label>チーム名 <span class="required">※必須</span></label>
      <input type="text" name="team" required>

      <label>代表者 <span class="required">※必須</span></label>
      <input type="text" name="leader" required>

      <label>メールアドレス <span class="required">※必須</span></label>
      <input type="email" name="email" required>

      <label>申込書（Excel） <span class="required">※必須</span></label>
      <div id="dropArea" class="drop-area">
        ここに .xlsx ファイルをドロップ<br>
        またはタップして選択
      </div>
      <input id="fileInput" type="file" name="file" accept=".xlsx" required>

      <button type="submit">送信</button>
    </form>

    <div id="msg"></div>
  </div>

<script>
const dropArea = document.getElementById("dropArea");
const fileInput = document.getElementById("fileInput");
const msg = document.getElementById("msg");

dropArea.addEventListener("click", () => fileInput.click());

dropArea.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropArea.classList.add("dragover");
});
dropArea.addEventListener("dragleave", () => {
  dropArea.classList.remove("dragover");
});
dropArea.addEventListener("drop", (e) => {
  e.preventDefault();
  dropArea.classList.remove("dragover");

  const file = e.dataTransfer.files[0];
  if (!file) return;

  if (!file.name.toLowerCase().endsWith(".xlsx")) {
    msg.textContent = "エラー：.xlsx のみアップロードできます。";
    return;
  }

  fileInput.files = e.dataTransfer.files;
  dropArea.textContent = "選択されたファイル：" + file.name;
});

document.getElementById("entryForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const form = e.target;

  msg.textContent = "受付処理中…";

  // --- 1〜3 を送信（entry） ---
  const entryData = new FormData();
  entryData.append("mode", "entry");
  entryData.append("team", form.team.value);
  entryData.append("leader", form.leader.value);
  entryData.append("email", form.email.value);

  await fetch("https://script.google.com/macros/s/AKfycbwVUIBhX4n1D1KdrJ6iTsdQuYU8CN4-oanpXS6-OGH1SiTlZAWG4qJOV9B9CpY-14lK/exec", {
    method: "POST",
    body: entryData
  }).then(r => r.json());

  if (entryRes.status !== "ok") {
    msg.textContent = "エラー：" + entryRes.status;
    return;
  }

  const number = entryRes.number;
  const token = entryRes.token;

  msg.textContent = `受付完了（受付番号：${number}）\n申込書アップロード中…`;

  // --- 申込書アップロード（upload） ---
  const uploadData = new FormData();
  uploadData.append("mode", "upload");
  uploadData.append("token", token);
  uploadData.append("file", fileInput.files[0]);

  await fetch("https://script.google.com/macros/s/AKfycbwVUIBhX4n1D1KdrJ6iTsdQuYU8CN4-oanpXS6-OGH1SiTlZAWG4qJOV9B9CpY-14lK/exec", {
    method: "POST",
    body: uploadData
  });

  msg.textContent = "すべて完了しました。ありがとうございました。";
});
</script>

</body>
</html>
