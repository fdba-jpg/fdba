<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>登録内容の確認・変更</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: "メイリオ", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 480px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    h2 {
      color: #003366;
      margin-top: 0;
      border-left: 6px solid #003366;
      padding-left: 10px;
      font-size: 20px;
    }
    p {
      font-size: 14px;
      color: #003366;
      line-height: 1.6;
    }
    .required {
      color: #cc0000;
      font-size: 12px;
      margin-left: 6px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      color: #003366;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      background-color: #0066cc;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    #result {
      margin-top: 15px;
      font-size: 14px;
      color: #333;
      background: #eef5ff;
      padding: 10px;
      border-left: 4px solid #0066cc;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>登録内容の確認・変更</h2>

    <form id="loadForm"
      action="https://script.google.com/macros/s/AKfycbz1y4lCqQuPYoBdlU4WRNNfB3cA355gB4MgluTw3p3TxcVnTHcqdQIWHZKxpWCqIKja/exec"
      method="POST" target="hiddenFrame">
      <input type="hidden" name="mode" value="get">
      <input type="hidden" name="userId" id="hiddenUserId">
    </form>

    <form action="https://script.google.com/macros/s/AKfycbws0_ijCHJUd31B9nABcyzZVuwON9-fWKXsZaYRcf3g8_WCIPqgfedAD9j4Ev4NwrRG/exec"
          method="POST">

      <label>ユーザID</label>
      <input type="text" id="userIdField" disabled style="background:#eee;">

      <input type="hidden" name="mode" value="update">
      <input type="hidden" name="userId" id="userIdHidden2">

      <label>チーム名</label>
      <input type="text" name="teamName" id="teamName">

      <label>代表者名</label>
      <input type="text" name="repName" id="repName">

      <label>メールアドレス1</label>
      <input type="email" name="mail1" id="mail1">

      <label>メールアドレス2</label>
      <input type="email" name="mail2" id="mail2">

      <label>電話番号</label>
      <input type="tel" name="tel" id="tel" placeholder="例: 09012345678">

      <button type="submit">更新する</button>
    </form>
  </div>

  <iframe name="hiddenFrame" style="display:none;"></iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const userId = params.get("id");

    if (userId) {
      document.getElementById("userIdField").value = userId;
      document.getElementById("hiddenUserId").value = userId;
      document.getElementById("userIdHidden2").value = userId;
      document.getElementById("loadForm").submit();
    } else {
      alert("ユーザIDが指定されていません。");
    }
  </script>

</body>
</html>
