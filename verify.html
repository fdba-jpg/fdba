<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>登録内容の確認・変更</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: "メイリオ", sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 480px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    h2 {
      color: #003366;
      margin-top: 0;
      border-left: 6px solid #003366;
      padding-left: 10px;
      font-size: 20px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      color: #003366;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      background-color: #0066cc;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>登録内容の確認・変更</h2>

    <!-- 更新フォーム（POST） -->
    <form id="updateForm"
      action="https://script.google.com/macros/s/AKfycbws0_ijCHJUd31B9nABcyzZVuwON9-fWKXsZaYRcf3g8_WCIPqgfedAD9j4Ev4NwrRG/exec"
      method="POST">

      <label>ユーザID</label>
      <input type="text" id="userIdField" disabled style="background:#eee;">

      <input type="hidden" name="mode" value="update">
      <input type="hidden" name="userId" id="userIdHidden2">

      <label>チーム名</label>
      <input type="text" name="teamName" id="teamName">

      <label>代表者名</label>
      <input type="text" name="repName" id="repName">

      <label>メールアドレス1</label>
      <input type="email" name="mail1" id="mail1">

      <label>メールアドレス2</label>
      <input type="email" name="mail2" id="mail2">

      <label>電話番号</label>
      <input type="tel" name="tel" id="tel" placeholder="例: 09012345678">

      <button type="submit">更新する</button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const userId = params.get("id");

    if (!userId) {
      alert("ユーザIDが指定されていません。");
    } else {
      // 画面にセット
      document.getElementById("userIdField").value = userId;
      document.getElementById("userIdHidden2").value = userId;

      const url =
        "https://script.google.com/macros/s/AKfycbws0_ijCHJUd31B9nABcyzZVuwON9-fWKXsZaYRcf3g8_WCIPqgfedAD9j4Ev4NwrRG/exec"
        + "?mode=get&userId=" + encodeURIComponent(userId);

      fetch(url)
        .then(res => res.json())
        .then(data => {
          document.getElementById("teamName").value = data.teamName || "";
          document.getElementById("repName").value = data.repName || "";
          document.getElementById("mail1").value = data.mail1 || "";
          document.getElementById("mail2").value = data.mail2 || "";
          document.getElementById("tel").value = data.tel || "";
        })
        .catch(err => {
          console.error("読み込みエラー:", err);
          alert("データの読み込みに失敗しました");
        });
    }
  </script>

</body>
</html>
